# Runs the API and the dashboard as two containers sharing the same
# project directory (bind mount), so both see the same model.pkl,
# logs.db, reference_data.csv, and drift_report.json.
#
# This is a simple local/demo setup, not a hardened production layout —
# a real deployment would put the model artifact in object storage and
# the logs in a proper database instead of a shared bind-mounted file.
services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - .:/app
